name: Build
on:
  workflow_call:
    inputs:
      site_repo:
        description: "The site repo to checkout."
        required: true
        type: string
      site_ref:
        description: "The site repo branch, tag, or SHA to checkout."
        required: true
        type: string
      base_url:
        description: "The base URL that the site will be deployed to. Examples: 'https://octocat.github.io/my-repo', 'https://octocat.github.io', 'https://www.example.com'."
        required: true
        type: string
      artifact_name:
        description: "The name of the GitHub Actions artifact to upload the built site to, if any."
        required: false
        type: string
    secrets:
      site_repo_ssh_key:
        description: "Private SSH deploy key with read access to site_repo (never expires)"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.site_repo }}
          ref: ${{ inputs.site_ref }}
          ssh-key: ${{ secrets.site_repo_ssh_key }}
          # Remove the key right after cloning, before any third-party code
          # (uv, PyPI packages, Pelican) runs in this job.
          persist-credentials: false
      # Third-party action pinned to an exact commit (v7.6.0); a moved tag can't change it.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          version: 0.10.7
      # uv installs the exact Python from .python-version itself, so runner
      # image updates (e.g. a new Ubuntu) can't break the build.
      - run: uv sync --locked
      - run: |
          uv run pelican \
          --settings pelicanconf.py \
          --extra-settings \
          SITEURL='"${{ inputs.base_url }}"' \
          FEED_DOMAIN='"${{ inputs.base_url }}"'
          # The theme lives in the site repo itself (THEME = "." in pelicanconf.py).
      - run: |
          echo "::group::Archive artifact"
          tar \
            --dereference \
            --hard-dereference \
            --directory output \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          echo "::endgroup::"
        if: ${{ inputs.artifact_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
        if: ${{ inputs.artifact_name }}
