name: Deploy
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:      # "Run workflow" button in the Actions tab
  schedule:
    - cron: '0 0 * * *'  # Every day at 00:00 UTC
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
        id: pages
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
  build:
    needs: pages
    uses: ./.github/workflows/build.yml
    with:
      site_repo: binodil/blog
      site_ref: main
      base_url: ${{ needs.pages.outputs.base_url }}
      artifact_name: "github-pages"
    secrets:
      site_repo_ssh_key: ${{ secrets.BLOG_DEPLOY_KEY }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
